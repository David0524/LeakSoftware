<h2>Reset your password</h2>

<p>We received a request to reset your password. Follow the link below to choose a new one.</p>
<p><a href="{{ if eq .RedirectTo .SiteURL }}{{ printf "%sauth/confirm?next=/reset-password&token_hash=%s&type=recovery" .SiteURL .TokenHash }}{{ else }}{{ printf "%s&token_hash=%s&type=recovery" .RedirectTo .TokenHash }}{{ end }}">Reset password</a></p>

<p>If you didn't request this, you can safely ignore this email.</p>
