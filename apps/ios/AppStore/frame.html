<!doctype html>
<!--
  One App Store screenshot (1320 x 2868): a headline, a line under it, and the real app screen in
  a plain rounded phone frame drawn here (no Apple device artwork). render.mjs fills it per shot
  with window.show({ title, subtitle, screen, logo }) and sets the brand colors from
  brand/tokens.json as CSS variables, so no brand color is written in this file.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Barlow Semi Condensed";
        font-weight: 800;
        src: url("../../../brand/fonts/BarlowSemiCondensed-ExtraBold.ttf");
      }
      @font-face {
        font-family: "Public Sans";
        font-weight: 500;
        src: url("../../../brand/fonts/PublicSans-Medium.ttf");
      }
      html,
      body {
        margin: 0;
        width: 1320px;
        height: 2868px;
        overflow: hidden;
        background: var(--bg);
      }
      .canvas {
        position: relative;
        width: 1320px;
        height: 2868px;
        overflow: hidden;
        background: var(--bg);
      }
      .head {
        position: absolute;
        left: 90px;
        right: 90px;
        top: 0;
        height: 630px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .logo {
        height: 64px;
        margin-bottom: 36px;
      }
      h1 {
        margin: 0;
        font-family: "Barlow Semi Condensed", sans-serif;
        font-weight: 800;
        font-size: 124px;
        line-height: 1.02;
        letter-spacing: -0.5px;
        color: var(--title);
        text-wrap: balance;
      }
      p {
        margin: 30px 0 0;
        font-family: "Public Sans", sans-serif;
        font-weight: 500;
        font-size: 54px;
        line-height: 1.3;
        color: var(--subtitle);
        text-wrap: balance;
      }
      .phone {
        position: absolute;
        left: 110px;
        top: 640px;
        width: 1100px;
        height: 2334px;
        box-sizing: border-box;
        border-radius: 172px;
        padding: 24px;
        background: var(--bezel);
        box-shadow: inset 0 0 0 4px var(--rim);
      }
      .screen {
        width: 1052px;
        height: 2286px;
        border-radius: 148px;
        overflow: hidden;
        background: var(--screen);
      }
      .screen img {
        display: block;
        width: 1052px;
        height: 2286px;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="head">
        <img class="logo" id="logo" alt="" hidden />
        <h1 id="title"></h1>
        <p id="subtitle"></p>
      </div>
      <div class="phone">
        <div class="screen"><img id="screen" alt="" /></div>
      </div>
    </div>
    <script>
      window.show = async ({ title, subtitle, screen, logo }) => {
        document.getElementById("title").textContent = title;
        const sub = document.getElementById("subtitle");
        sub.textContent = subtitle ?? "";
        sub.hidden = !subtitle;
        const mark = document.getElementById("logo");
        mark.hidden = !logo;
        if (logo) mark.src = logo;
        const img = document.getElementById("screen");
        img.src = screen;
        await Promise.all([img.decode(), logo ? mark.decode() : null, document.fonts.ready]);
      };
    </script>
  </body>
</html>
