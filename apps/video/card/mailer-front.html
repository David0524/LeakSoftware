<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sundeck Pro mailer, front</title>
    <link rel="stylesheet" href="card.css" />
    <link rel="stylesheet" href="mailer.css" />
    <style>
      h1 {
        left: 72px;
        top: 214px;
        font-size: 228px;
        line-height: 0.86;
      }
      .sub {
        left: 78px;
        top: 845px;
        width: 860px;
        font-family: Barlow;
        font-weight: 700;
        font-size: 60px;
        line-height: 1.08;
        color: rgba(255, 255, 255, 0.9);
      }
      .svc {
        left: 80px;
        top: 935px;
        width: 800px;
        font-weight: 600;
        font-size: 36px;
        line-height: 1.35;
        color: rgba(255, 255, 255, 0.8);
      }
      .stores {
        left: 78px;
        top: 1100px;
      }
      /* Sign up, as on the card's foot, with the mailer's own QR (?from=mailer). */
      .foot {
        top: 1505px;
        width: 2550px;
      }
      /* The laminate card's hero (browser, phones, callouts), framed from front.html#hero so
         the two stay one drawing. The card's hero spans x 50 to 1750, y 650 to 1790 of the
         card; scaled 1.02 it sits right of the headline. */
      .hero {
        left: calc(900px - 1.02 * (37.5px + 50px));
        top: calc(275px - 1.02 * (37.5px + 650px));
        width: 1875px;
        height: 2475px;
        border: 0;
        transform: scale(1.02);
        transform-origin: 0 0;
      }
    </style>
  </head>
  <body>
    <img class="water" src="mailer-bg.png" alt="" />
    <div class="card">
      <iframe class="abs hero" src="front.html#hero"></iframe>
      <img class="abs logo" src="../../../brand/logo/sundeck-logo-reverse.svg" />
      <h1 class="abs">Find it.<br />Fix it.<br /><span class="o">Get paid.</span></h1>
      <p class="abs sub">One app for the whole pool shop.</p>
      <p class="abs svc">For pool maintenance, repairs, leak detection and inspections.</p>
      <div class="abs stores">
        <img src="../../web/public/badges/app-store.svg" alt="Download on the App Store" />
        <img src="../../web/public/badges/google-play.png" alt="Get it on Google Play" />
      </div>
      <div class="abs foot glass white">
        <div class="qr"><img src="qr-mailer.svg" /></div>
        <div class="cta">
          <div class="btn">Start Your Free Trial</div>
          <div class="row">
            <div class="url">sundeckpro.com</div>
            <div class="price">Starting at $49/mo</div>
          </div>
        </div>
        <div class="contact">office@sundeckpro.com<br /><span>Call</span> (702) 785-1548</div>
      </div>
    </div>
  </body>
</html>
