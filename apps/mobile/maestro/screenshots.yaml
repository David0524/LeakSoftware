# The Android store screenshots (docs/play-store/listing.md), driven by Maestro on an emulator
# in .github/workflows/android-screenshots.yml. Signs in as the demo owner, then opens each
# screen by its sundeckpro:// link. Env: EMAIL, PASSWORD, LEAK_JOB, SENT_JOB, VISIT_JOB (from
# targets.mjs). The pictures land in Maestro's output folder; run.sh copies them out.
appId: com.sundeckpro.app
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "name@example.com"
    timeout: 90000
- tapOn: "name@example.com"
- inputText: ${EMAIL}
- tapOn: "Required"
- inputText: ${PASSWORD}
- pressKey: Enter
# The first sign-in downloads the shop to the phone.
- extendedWaitUntil:
    visible: "Today"
    timeout: 120000
# Wait for the whole shop to download (the banner goes, teammates' names arrive).
- extendedWaitUntil:
    notVisible: "Downloading your company.*"
    timeout: 600000
# Start the app again on the downloaded shop, as a tech opening it in the morning.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Today"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 15000

- openLink: sundeckpro://
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 1-today

- openLink: sundeckpro://schedule
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 2-schedule

- openLink: sundeckpro://jobs
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 3-jobs

- openLink: sundeckpro://jobs/${LEAK_JOB}?section=checklist
- extendedWaitUntil:
    visible: "Checklist"
    timeout: 30000
- tapOn: "Checklist"
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 4-leak-checklist

- openLink: sundeckpro://jobs/${VISIT_JOB}?section=checklist
- extendedWaitUntil:
    visible: "Checklist"
    timeout: 30000
- tapOn: "Checklist"
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 5-service-checklist

- openLink: sundeckpro://jobs/${SENT_JOB}?section=wrapup
- extendedWaitUntil:
    visible: "Wrap-Up"
    timeout: 30000
# The job screen keeps the last section it showed, so pick Wrap-Up.
- tapOn: "Wrap-Up"
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 6-wrap-up

# The finished job's Review and Sign: the report the customer reads.
- openLink: sundeckpro://jobs/${SENT_JOB}/review
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 7-review
# Review and Sign is a sheet: close it so the next link shows.
- tapOn: "Cancel"
- waitForAnimationToEnd:
    timeout: 15000

- openLink: sundeckpro://invoices
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 8-invoices
