name: Android screenshots

# The Android app's Play Store screenshots (docs/play-store/listing.md). Takes the latest
# finished EAS Android build (or the .aab link given), turns it into an APK signed with a debug
# key, runs it on a Pixel-sized emulator (1080 × 1920, Play's 9:16), signs in as the demo owner
# and opens eight screens by link (apps/mobile/maestro/). Saves them as the
# `android-screenshots` artifact. Only by hand: Actions › Android screenshots › Run workflow.
# Before running: `pnpm demo:reset -- --apply`, so the demo shop's route is today's.

on:
  workflow_dispatch:
    inputs:
      aab_url:
        description: "App bundle (.aab) link. Empty: the latest finished EAS Android build."
        type: string
        default: ""
      backend:
        description: "Supabase project the build uses (config/supabase-<backend>.json)"
        type: choice
        options: [dev, production]
        default: dev

concurrency:
  group: android-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screens:
    name: Play Store screenshots (Android emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find the app bundle
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          AAB_URL: ${{ inputs.aab_url }}
        run: |
          if [ -z "$AAB_URL" ]; then
            test -n "$EXPO_TOKEN" || { echo "::error::No aab_url given and no EXPO_TOKEN secret"; exit 1; }
            pnpm install --frozen-lockfile
            cd apps/mobile
            npx eas-cli@latest build:list --platform android --status finished --limit 1 \
              --json --non-interactive > "$RUNNER_TEMP/builds.json"
            AAB_URL=$(node -p 'require(process.argv[1])[0].artifacts.buildUrl' "$RUNNER_TEMP/builds.json")
            node -p 'const b = require(process.argv[1])[0]; "Build " + b.appVersion + " (" + b.appBuildVersion + ")"' "$RUNNER_TEMP/builds.json"
          fi
          echo "App bundle: $AAB_URL"
          curl -fsSL -o "$RUNNER_TEMP/app.aab" "$AAB_URL"

      - name: Make an APK from it
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" \
            https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --mode=universal \
            --bundle "$RUNNER_TEMP/app.aab" --output "$RUNNER_TEMP/app.apks" \
            --ks ~/.android/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey \
            --key-pass pass:android
          unzip -o -q "$RUNNER_TEMP/app.apks" universal.apk -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/universal.apk" "$RUNNER_TEMP/app.apk"
          ls -l "$RUNNER_TEMP/app.apk"

      - name: Pick the demo shop's jobs
        run: node apps/mobile/maestro/targets.mjs "${{ inputs.backend }}" >> "$GITHUB_ENV"

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screens in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash apps/mobile/maestro/run.sh "$RUNNER_TEMP/app.apk" "$RUNNER_TEMP/shots"

      - name: Check the sizes
        run: |
          cd "$RUNNER_TEMP/shots"
          ls -1 *.png
          test "$(ls -1 *.png | wc -l)" -eq 8 || { echo "::error::Expected 8 screenshots"; exit 1; }
          for f in *.png; do
            size=$(file "$f" | grep -o '[0-9]* x [0-9]*')
            echo "$f $size"
            test "$size" = "1080 x 1920" || { echo "::error::$f is $size, not 1080 x 1920"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots
          path: |
            ${{ runner.temp }}/shots/*.png
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots-debug
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
          retention-days: 14
