name: App Store

# Shows where the iPhone app stands on App Store Connect (versions, builds), or submits the
# version in apps/ios/Info.plist for App Review with its newest TestFlight build and the What's
# New text in docs/release/APP_STORE.md (scripts/app-store-submit.mjs). Only when asked:
# Actions › App Store › Run workflow. A submitted version goes on the App Store as soon as Apple
# approves it (owner, 2026-11-18). release puts an approved version that waits for a manual
# release on the App Store, only the one named in "Version to release" (owner, 2026-11-17).
# Same App Store Connect key as the TestFlight workflow (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8).

on:
  workflow_dispatch:
    inputs:
      action:
        description: "status: show versions and builds. submit: submit the Info.plist version for App Review. resubmit: take it back from review and submit it again with a newer build. release: put the approved version named below on the App Store."
        type: choice
        options: [status, submit, resubmit, release]
        default: status
      build:
        description: "Build number to submit (blank: the newest processed build of that version)"
        type: string
        default: ""
      release_version:
        description: "Version to release (release only), like 1.0.3"
        type: string
        default: ""

concurrency:
  group: app-store
  cancel-in-progress: false

jobs:
  app-store:
    name: App Store Connect
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      APP_STORE_APP_ID: "6824555420"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write the App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          dir="$RUNNER_TEMP/asc"
          mkdir -p "$dir"
          printf '%s\n' "$ASC_KEY_P8" > "$dir/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$dir/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: ${{ inputs.action == 'status' && 'Status' || inputs.action == 'release' && 'Release' || 'Submit for App Review' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ACTION: ${{ inputs.action }}
          BUILD: ${{ inputs.build }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: node scripts/app-store-submit.mjs

      - name: Delete the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
