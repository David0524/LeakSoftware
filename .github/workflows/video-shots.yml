# The iPhone frames for the demo videos (docs/plans/demo-videos.md): the app's real screens
# with the two video shops' days seeded on the phone, rendered in the iPhone simulator by
# apps/ios/Tests/SundeckAppScreenshots/VideoShots.swift (which runs only with VIDEO_SHOTS=1, so
# ci.yml's screenshot run skips it). The PNGs are uploaded as the `video-iphone-shots` artifact.
name: Video shots

on:
  workflow_dispatch:
  # workflow_dispatch works only once this file is on the default branch; until then a push to
  # a demo-videos branch that touches the suite or this file runs it.
  push:
    branches:
      - "claude/demo-videos-*"
    paths:
      - apps/ios/Tests/SundeckAppScreenshots/VideoShots.swift
      - .github/workflows/video-shots.yml

concurrency:
  group: video-shots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iphone:
    name: Video frames in the iPhone simulator
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && swift --version
      - name: Render the video frames
        working-directory: apps/ios
        run: |
          # An iPhone 17 Pro when the runner has one (the videos' 402 x 874 pt frame), else the
          # newest iPhone.
          device=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if "iOS" in k), reverse=True)
          phones = [d for k in runtimes for d in devices[k] if d["name"].startswith("iPhone")]
          pro = [d for d in phones if d["name"] == "iPhone 17 Pro"]
          print((pro or phones)[0]["udid"])')
          mkdir -p "$RUNNER_TEMP/video-shots"
          TEST_RUNNER_SCREENSHOT_DIR="$RUNNER_TEMP/video-shots" TEST_RUNNER_VIDEO_SHOTS=1 \
            xcodebuild test -scheme SundeckPro-Package \
            -destination "id=$device" -only-testing:SundeckAppScreenshots/VideoShots \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-iphone-shots
          path: ${{ runner.temp }}/video-shots
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: video-crash-reports
          path: ~/Library/Logs/DiagnosticReports/xctest*
          if-no-files-found: ignore
          retention-days: 14
