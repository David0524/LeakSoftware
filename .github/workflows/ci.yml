name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @leakbook/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Bundle the mobile app (catches broken imports and assets)
        run: npx expo export --platform ios --output-dir /tmp/expo-check
        working-directory: apps/mobile
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"

  database:
    name: Database (Supabase + pgTAP)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:db
        env:
          DB_TEST_MODE: docker

  e2e:
    name: Office web app (Playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase (migrations and demo seed)
        run: pnpm exec supabase start -x realtime,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Point the web app at it
        run: |
          pnpm exec supabase status -o env > /tmp/supabase.env
          url=$(grep '^API_URL=' /tmp/supabase.env | cut -d= -f2- | tr -d '"')
          key=$(grep '^ANON_KEY=' /tmp/supabase.env | cut -d= -f2- | tr -d '"')
          service=$(grep '^SERVICE_ROLE_KEY=' /tmp/supabase.env | cut -d= -f2- | tr -d '"')
          echo "::add-mask::$service"
          echo "SUPABASE_URL=$url" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$key" >> "$GITHUB_ENV"
          # Local Docker stack's well-known key: lets the app record Stripe webhooks.
          echo "SUPABASE_SERVICE_ROLE_KEY=$service" >> "$GITHUB_ENV"
      - run: pnpm --filter @leakbook/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: pnpm --filter @leakbook/web exec playwright install --with-deps chromium
      - run: pnpm --filter @leakbook/web test:e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
