name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What this push can affect (owner, 2026-10-21: "We need to speed up this process"), so the
  # slow jobs run only when they can: the iPhone jobs for Swift and core, the database for SQL
  # and sync, the browser tests for the website. A branch is compared with the default branch,
  # not the previous push, so nothing is missed when a newer push cancels a run. Workflow,
  # lockfile, script, or root changes, and anything unclear, run everything.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    outputs:
      ios: ${{ steps.pick.outputs.ios }}
      db: ${{ steps.pick.outputs.db }}
      web: ${{ steps.pick.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          DEFAULT: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          all() { echo "ios=true" >> "$GITHUB_OUTPUT"; echo "db=true" >> "$GITHUB_OUTPUT"; echo "web=true" >> "$GITHUB_OUTPUT"; echo "$1: everything runs"; exit 0; }
          if [ -n "$PR_BASE" ]; then base=$PR_BASE
          elif [ "$GITHUB_REF_NAME" != "$DEFAULT" ]; then base=$(git merge-base HEAD "origin/$DEFAULT" 2>/dev/null) || all "no merge base"
          else base=$BEFORE; fi
          git cat-file -e "$base^{commit}" 2>/dev/null || all "no base commit"
          files=$(git diff --name-only "$base" HEAD)
          echo "$files"
          [ -z "$files" ] && all "no changed files"
          if echo "$files" | grep -qE '^(\.github/|scripts/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json|tsconfig)'; then all "shared setup changed"; fi
          has() { echo "$files" | grep -qE "$1" && echo true || echo false; }
          echo "ios=$(has '^(apps/ios/|packages/core/)')" >> "$GITHUB_OUTPUT"
          echo "db=$(has '^(supabase/|packages/sync/|packages/core/|apps/ios/)')" >> "$GITHUB_OUTPUT"
          echo "web=$(has '^(apps/web/|packages/|supabase/|brand/)')" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The web build runs in the e2e job, against Supabase.
      - name: Bundle the mobile app (catches broken imports and assets)
        run: npx expo export --platform ios --output-dir /tmp/expo-check
        working-directory: apps/mobile
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"

  ios-linux:
    name: iPhone app libraries (Swift on Linux)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ubuntu-24.04
    container: swift:6.4.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift format lint --strict -r apps/ios/Sources apps/ios/Tests apps/ios/Package.swift
      - run: swift test --package-path apps/ios

  ios-macos:
    name: iPhone app (Xcode)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && swift --version
      # The Swift tests run in ios-linux; this job builds the app and renders its screens.
      - name: Build for iPhone
        working-directory: apps/ios
        run: >
          xcodebuild build -scheme SundeckPro -destination 'generic/platform=iOS'
          -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
      # Each screen rendered in the iPhone simulator, light and dark, saved as an artifact.
      - name: Screenshots in the iPhone simulator
        working-directory: apps/ios
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if "iOS" in k), reverse=True)
          print(next(d["udid"] for k in runtimes for d in devices[k] if d["name"].startswith("iPhone")))')
          mkdir -p "$RUNNER_TEMP/screenshots"
          TEST_RUNNER_SCREENSHOT_DIR="$RUNNER_TEMP/screenshots" xcodebuild test -scheme SundeckPro-Package \
            -destination "id=$device" -only-testing:SundeckAppScreenshots \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-screenshots
          path: ${{ runner.temp }}/screenshots
          retention-days: 14
      # When the screenshot process crashes ("Restarting after unexpected exit"), its crash
      # report names the frame; the log alone doesn't.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: iphone-crash-reports
          path: ~/Library/Logs/DiagnosticReports/xctest*
          if-no-files-found: ignore
          retention-days: 14

  database:
    name: Database (Supabase + pgTAP)
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Swift, so test:db also runs the iPhone app's sync engine against the database.
      - run: sudo SETUP_IOS_SWIFT_ONLY=1 bash scripts/setup-ios.sh
      - run: pnpm test:db
        env:
          DB_TEST_MODE: docker

  e2e:
    name: Office web app (Playwright)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase (migrations and demo seed)
        run: pnpm exec supabase start -x realtime,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Point the web app at it
        run: |
          pnpm exec supabase status -o env > /tmp/supabase.env
          url=$(grep '^API_URL=' /tmp/supabase.env | cut -d= -f2- | tr -d '"')
          key=$(grep '^ANON_KEY=' /tmp/supabase.env | cut -d= -f2- | tr -d '"')
          service=$(grep '^SERVICE_ROLE_KEY=' /tmp/supabase.env | cut -d= -f2- | tr -d '"')
          echo "::add-mask::$service"
          echo "SUPABASE_URL=$url" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$key" >> "$GITHUB_ENV"
          # Local Docker stack's well-known key: lets the app record Stripe webhooks.
          echo "SUPABASE_SERVICE_ROLE_KEY=$service" >> "$GITHUB_ENV"
      - run: pnpm --filter @leakbook/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: pnpm --filter @leakbook/web exec playwright install --with-deps chromium
      - run: pnpm --filter @leakbook/web test:e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
